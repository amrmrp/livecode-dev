name: Deploy Astro Site

on:
  push:
    branches: [ main ] # یا master بسته به نام برنچ اصلیت

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # کش کردن پکیج‌ها برای سرعت در بیلدهای بعدی

      - name: Install dependencies
        run: npm ci # استفاده از ci برای محیط CI الزامی است (پایداری ورژن‌ها)

      - name: Build Astro
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=REAL_PROJECT_NAME


